name: CI

on:
  push:
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Build distribution
        run: poetry build

  release-sample-report:
    name: Release Sample Report
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: AI
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install build dependencies
        run: poetry install --with dev --no-interaction

      - name: Generate sample report
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p docs
          if [ -n "${GEMINI_API_KEY}" ]; then
            poetry run python src/aiqo_pg_ai_report/pg_autoexplain_analyzer.py tests/data/sample.log -r docs/sample.log_report.html --language english
            poetry run python src/aiqo_pg_ai_report/pg_autoexplain_analyzer.py tests/data/sample.log --target-query 421865 -r docs/target_query_report.html --language english
          else
            poetry run python src/aiqo_pg_ai_report/pg_autoexplain_analyzer.py tests/data/sample.log --skip_ai_analysis -r docs/sample.log_report.html
            poetry run python src/aiqo_pg_ai_report/pg_autoexplain_analyzer.py tests/data/sample.log --skip_ai_analysis --target-query 421865 -r docs/target_query_report.html --language english
          fi
          zip -j docs/sample_report.zip docs/sample.log_report.html
          zip -j docs/target_query_report_421865.zip docs/target_query_report_421865.html

      - name: Upload sample report asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            docs/sample_report.zip
            docs/target_query_report_421865.zip

  release-binaries:
    name: Release ${{ matrix.label }}
    needs:
      - test
      - release-sample-report
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact: dist/linux/pg_aiqo_report
            archive_asset: dist/linux/pg_aiqo_report-linux.zip
            label: Linux Binary
          - os: ubuntu-latest
            target: linux-centos6
            artifact: dist/linux-centos6/pg_aiqo_report
            archive_asset: dist/linux-centos6/pg_aiqo_report-linux-centos6-x86_64.zip
            label: Linux CentOS 6 Binary
          - os: macos-latest
            target: macos-silicon
            artifact: dist/macos-silicon/pg_aiqo_report
            archive_asset: dist/macos-silicon/pg_aiqo_report-macos-silicon.zip
            label: macOS Binary
          - os: windows-latest
            target: windows
            artifact: dist/windows/pg_aiqo_report.exe
            archive_asset: dist/windows/pg_aiqo_report-windows.zip
            label: Windows Binary
    runs-on: ${{ matrix.os }}
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.github-cache/nuitka/${{ matrix.target }}
      NUITKA_CACHE_DIR_CCACHE: ${{ github.workspace }}/.github-cache/nuitka/${{ matrix.target }}/ccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ccache (Linux)
        if: runner.os == 'Linux' && matrix.target != 'linux-centos6'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Restore Nuitka build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ matrix.target }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml', 'Dockerfile.nuitka-centos6', 'scripts/build_nuitka*.sh', 'scripts/*centos6*.sh', '.github/workflows/ci.yml') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ matrix.target }}-py${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Poetry
        if: matrix.target != 'linux-centos6'
        run: pipx install poetry

      - name: Install build dependencies
        if: matrix.target != 'linux-centos6'
        run: poetry install --with dev --no-interaction

      - name: Build native binary
        if: matrix.target != 'linux-centos6'
        run: bash scripts/build_nuitka.sh ${{ matrix.target }}

      - name: Smoke test native binary
        if: matrix.target != 'linux-centos6'
        shell: bash
        run: |
          "./${{ matrix.artifact }}" --version

      - name: Set up Docker Buildx
        if: matrix.target == 'linux-centos6'
        uses: docker/setup-buildx-action@v3

      - name: Build CentOS 6 toolchain image
        if: matrix.target == 'linux-centos6'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nuitka-centos6
          tags: aiqo-report-nuitka-centos6
          load: true
          cache-from: type=gha,scope=centos6-toolchain
          cache-to: type=gha,mode=max,scope=centos6-toolchain

      - name: Build CentOS 6 compatible binary
        if: matrix.target == 'linux-centos6'
        env:
          CENTOS6_SKIP_IMAGE_BUILD: "1"
        run: bash scripts/build_nuitka_centos6.sh

      - name: Smoke test on CentOS 6 userspace
        if: matrix.target == 'linux-centos6'
        shell: bash
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            quay.io/pypa/manylinux2010_x86_64:latest \
            /workspace/${{ matrix.artifact }} --version

      - name: Prepare ZIP release asset
        if: matrix.target != 'windows'
        shell: bash
        run: zip -j "${{ matrix.archive_asset }}" "${{ matrix.artifact }}"

      - name: Prepare ZIP release asset
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.artifact }}' -DestinationPath '${{ matrix.archive_asset }}' -Force

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.archive_asset }}
